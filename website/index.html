<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GovShield | Phishing Domain Verification Engine</title>
    <meta name="description" content="Intelligent multi-signal verification engine for detecting deceptive lookalike domains and credential harvesting.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Top Bar / Micro Header -->
        <header class="top-bar">
            <div class="brand-row">
                <span class="brand-main">GovShield</span>
                <span class="brand-sub">SIH·26</span>
            </div>
            <div class="status-pill">
                <span class="status-dot"></span>
                <span>Online</span>
            </div>
        </header>

        <!-- Hero Section -->
        <section class="hero-minimal">
            <h1 class="hero-title-large">
                Phishing Domain<br>Verification Engine
            </h1>
            <p class="hero-tagline">
                Real-time multi-signal analysis detecting lookalikes, credential harvesting, and fraudulent clones.
            </p>
        </section>

        <!-- URL Scanner Core -->
        <main class="scanner-section">
            <!-- Search Box -->
            <div class="search-box-minimal">
                <input 
                    type="url" 
                    id="urlInput" 
                    class="url-input-clean" 
                    placeholder="Enter website URL (e.g., https://pmkisan-gov-in-update.online)" 
                    autocomplete="off"
                    spellcheck="false"
                >
                <button id="scanBtn" class="btn-scan-action">
                    <span>Inspect</span> ↵
                </button>
            </div>

            <!-- Dynamic Result Card -->
            <div id="resultsWrapper" style="display: none;">
                <div class="verdict-card-minimal">
                    <!-- Verdict Header -->
                    <div class="verdict-header-block">
                        <div class="verdict-number-row">
                            <div class="giant-score" id="scoreNumber">00</div>
                            <div class="verdict-text-group">
                                <span id="verdictBadge" class="verdict-badge-clean badge-threat">CRITICAL THREAT</span>
                                <div class="target-url-line" id="urlHeadline">https://example.com</div>
                                <p class="verdict-summary-line" id="verdictSummary">Summary loading...</p>
                            </div>
                        </div>
                        <div class="verdict-actions">
                            <button id="btnQuickDossier" class="btn-dossier-pill">
                                <span>📄</span> Copy Incident Report
                            </button>
                        </div>
                    </div>

                    <!-- 5 Numbered Inspection Steps (Inspo: Image 2 & 3) -->
                    <div class="inspection-steps-grid" id="inspectionSteps">
                        <!-- Injected dynamically -->
                    </div>

                    <!-- Citizen Advisory -->
                    <div class="advisory-footer">
                        <span style="font-weight: 700; color: var(--text-pure);">ADVISORY:</span>
                        <span id="remediationText" style="flex: 1;">Citizen advice loading...</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- CERT-In Dossier Modal -->
    <div id="dossierModal" class="modal-overlay">
        <div class="modal-content-clean">
            <div class="modal-top">
                <span class="modal-title-clean">CERT-In Incident Takedown Report</span>
                <button id="modalCloseBtn" class="modal-close-x">&times;</button>
            </div>
            <pre id="dossierText" class="dossier-code-box"></pre>
            <div style="display: flex; justify-content: flex-end;">
                <button id="copyDossierBtn" class="btn-scan-action">
                    Copy Report to Clipboard
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="detector.js"></script>
    <script src="app.js"></script>
</body>
</html>
